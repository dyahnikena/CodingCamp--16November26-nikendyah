<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── HEADER ───────────── -->
    <header class="header">
      <div class="header__left">
        <span id="greeting" class="greeting"></span>
        <span id="datetime" class="datetime"></span>
      </div>
      <button id="themeToggle" class="btn btn--icon" aria-label="Toggle theme" title="Toggle light / dark mode">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </header>

    <!-- ───────────── MAIN ───────────── -->
    <main class="dashboard">

      <!-- ── FOCUS TIMER ── -->
      <section class="card timer-card" aria-label="Focus Timer">
        <h2 class="card__title">🎯 Focus Timer</h2>

        <div class="timer__ring-wrapper" aria-hidden="true">
          <svg class="timer__ring" viewBox="0 0 120 120">
            <circle class="timer__ring-track" cx="60" cy="60" r="52" />
            <circle class="timer__ring-progress" id="timerRing" cx="60" cy="60" r="52" />
          </svg>
          <div class="timer__display" id="timerDisplay">25:00</div>
        </div>

        <div class="timer__controls">
          <button id="timerStart" class="btn btn--primary">▶ Start</button>
          <button id="timerStop"  class="btn btn--secondary">⏸ Pause</button>
          <button id="timerReset" class="btn btn--ghost">↺ Reset</button>
        </div>

        <div class="timer__settings">
          <label for="pomodoroMinutes" class="label">Custom duration (min)</label>
          <div class="timer__settings-row">
            <input id="pomodoroMinutes" class="input input--small" type="number" min="1" max="120" value="25" />
            <button id="pomodoroSet" class="btn btn--ghost btn--sm">Set</button>
          </div>
        </div>
      </section>

      <!-- ── TO-DO LIST ── -->
      <section class="card todo-card" aria-label="To-Do List">
        <div class="todo__header">
          <h2 class="card__title">📝 To-Do List</h2>
          <div class="todo__sort">
            <label for="sortSelect" class="label">Sort</label>
            <select id="sortSelect" class="input input--small">
              <option value="default">Default</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="done">Done last</option>
              <option value="undone">Done first</option>
            </select>
          </div>
        </div>

        <form id="todoForm" class="todo__form" autocomplete="off">
          <input id="todoInput" class="input" type="text" placeholder="Add a new task…" maxlength="120" required />
          <button type="submit" class="btn btn--primary">Add</button>
        </form>

        <ul id="todoList" class="todo__list" role="list"></ul>

        <p id="todoEmpty" class="todo__empty">No tasks yet. Add one above! ✨</p>
      </section>

      <!-- ── QUICK LINKS ── -->
      <section class="card links-card" aria-label="Quick Links">
        <h2 class="card__title">🔗 Quick Links</h2>

        <form id="linkForm" class="links__form" autocomplete="off">
          <input id="linkName" class="input" type="text"  placeholder="Label (e.g. GitHub)" maxlength="30" required />
          <input id="linkUrl"  class="input" type="url"   placeholder="https://…" required />
          <button type="submit" class="btn btn--primary">Add</button>
        </form>

        <div id="linkList" class="links__list"></div>

        <p id="linksEmpty" class="links__empty">No links saved yet.</p>
      </section>

    </main>

    <!-- ── EDIT TASK MODAL ── -->
    <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle" hidden>
      <div class="modal__backdrop"></div>
      <div class="modal__box">
        <h3 id="editModalTitle" class="modal__title">Edit Task</h3>
        <input id="editInput" class="input" type="text" maxlength="120" />
        <div class="modal__actions">
          <button id="editSave"   class="btn btn--primary">Save</button>
          <button id="editCancel" class="btn btn--ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ── TIMER DONE TOAST ── -->
    <div id="toast" class="toast" aria-live="polite" hidden>
      <span id="toastMsg"></span>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
